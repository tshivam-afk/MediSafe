name: Release MediSafe APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g., 1.0.0, 1.0.1). Leave empty to auto-increment from previous release or start at 1.0.0'
        required: false
        default: ''
        type: string
      release_notes:
        description: 'Release Notes / Changelog (Optional)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine Next Version
        id: versioning
        run: |
          INPUT_VER="${{ github.event.inputs.version }}"
          INPUT_VER="${INPUT_VER#v}" # remove leading 'v' if present

          if [ -n "$INPUT_VER" ]; then
            VERSION="$INPUT_VER"
            echo "Using manual input version: $VERSION"
          else
            LATEST_TAG=$(git tag -l "v*.*.*" --sort=-v:refname | head -n 1)
            if [ -z "$LATEST_TAG" ]; then
              LATEST_TAG=$(git tag -l "*.*.*" --sort=-v:refname | head -n 1)
            fi

            if [ -z "$LATEST_TAG" ]; then
              VERSION="1.0.0"
              echo "No previous tags found. Starting version: $VERSION"
            else
              echo "Found latest tag: $LATEST_TAG"
              CLEAN_TAG="${LATEST_TAG#v}"

              MAJOR=$(echo "$CLEAN_TAG" | awk -F. '{print $1}')
              MINOR=$(echo "$CLEAN_TAG" | awk -F. '{print $2}')
              PATCH=$(echo "$CLEAN_TAG" | awk -F. '{print $3}')

              MAJOR=${MAJOR:-1}
              MINOR=${MINOR:-0}
              PATCH=${PATCH:-0}

              NEW_PATCH=$((PATCH + 1))
              VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
              echo "Auto-incremented to version: $VERSION"
            fi
          fi

          TAG_NAME="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Android SDK Build-Tools & apksigner
        run: |
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          BUILD_TOOLS_DIR=$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          echo "Using build-tools at: $BUILD_TOOLS_DIR"
          echo "$BUILD_TOOLS_DIR" >> "$GITHUB_PATH"

      - name: Decode Keystore File
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY_BASE64" ]; then
            echo "Error: SIGNING_KEY secret is not set or empty in GitHub repository secrets."
            exit 1
          fi
          echo "$SIGNING_KEY_BASE64" | base64 --decode > keystore_medisafe.p12
          echo "Successfully created keystore_medisafe.p12 ($(wc -c < keystore_medisafe.p12) bytes)"

      - name: Build Android Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore_medisafe.p12
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            gradle assembleRelease --no-daemon --stacktrace
          fi

      - name: Sign & Verify APK with Keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION: ${{ steps.versioning.outputs.version }}
        run: |
          FOUND_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$FOUND_APK" ]; then
            echo "Error: Release APK not found in app/build/outputs/apk/release"
            exit 1
          fi
          echo "Found generated APK: $FOUND_APK"

          FINAL_APK="MediSafe-v${VERSION}.apk"

          if apksigner verify "$FOUND_APK" >/dev/null 2>&1; then
            echo "APK is already signed by Gradle."
            cp "$FOUND_APK" "$FINAL_APK"
          else
            echo "Signing APK with keystore_medisafe.p12 and alias: $KEY_ALIAS ..."
            apksigner sign \
              --ks keystore_medisafe.p12 \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$FINAL_APK" \
              "$FOUND_APK"
          fi

          echo "Verifying signature of $FINAL_APK ..."
          apksigner verify --verbose "$FINAL_APK"

          rm -f keystore_medisafe.p12

          echo "apk_path=$FINAL_APK" >> "$GITHUB_ENV"

      - name: Prepare Release Notes
        id: notes
        env:
          INPUT_NOTES: ${{ github.event.inputs.release_notes }}
          VERSION: ${{ steps.versioning.outputs.version }}
          TAG_NAME: ${{ steps.versioning.outputs.tag }}
        run: |
          NOTES_FILE="RELEASE_NOTES.md"

          if [ -n "$INPUT_NOTES" ]; then
            echo "$INPUT_NOTES" > "$NOTES_FILE"
          else
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            {
              echo "## 💊 MediSafe v${VERSION}"
              echo ""
              echo "### What's New"
              if [ -n "$PREV_TAG" ]; then
                echo "Changes since **${PREV_TAG}**:"
                echo ""
                git log "${PREV_TAG}..HEAD" --pretty=format:"* %s (%h)" || echo "* General improvements and optimizations."
              else
                echo "* Initial release of MediSafe v${VERSION}."
                echo "* Medication, Daily Tasks, and Events reminder tracker."
                echo "* Local persistence with Room and intelligent alarm scheduling."
              fi
              echo ""
              echo "---"
              echo "**Asset:** \`MediSafe-v${VERSION}.apk\` (Signed Release Build)"
            } > "$NOTES_FILE"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: MediSafe ${{ steps.versioning.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: ${{ env.apk_path }}
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
